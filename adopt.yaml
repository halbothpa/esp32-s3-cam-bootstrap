# Public, token-free adoption configuration.
# Secret VALUES are resolved only by the user's local ESPHome instance.
substitutions:
  device_name: esp32-s3-cam
  friendly_name: ESP32-S3 Camera

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.7.4

packages:
  camera:
    url: https://github.com/halbothpa/esp32-s3-cam-bootstrap.git
    ref: main
    files:
      - packages/camera.yaml
    refresh: 1d

external_components:
  - source:
      type: git
      url: https://github.com/halbothpa/esp32-s3-cam-bootstrap.git
      ref: main
    components:
      - sd_snapshot
    refresh: 1d

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 15min

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret fallback_ap_password

captive_portal:

web_server:
  port: 80
  version: 3
  local: true
  ota: false
  auth:
    username: !secret web_username
    password: !secret web_password
    type: digest
